spring:
  application:
    name: coursehub

  profiles:
    active: dev

  # Database
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/coursehub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  # Flyway Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    # false: DB duoc tao moi hoan toan boi V1__coursehub_schema.sql
    # Neu DB da ton tai voi migration cu: can DROP DATABASE truoc khi chay
    baseline-on-migrate: false
    validate-on-migrate: true
    # Ngan flyway:clean vo tinh xoa data tren production
    clean-disabled: true
    # mixed=true: cho phep SET @var + DDL cung chay trong 1 migration
    mixed: true
    # Doc dung encoding tieng Viet trong sample data
    encoding: UTF-8

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Mail
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  # OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            scope: email,profile
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# Server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:CourseHubSuperSecretKeyForJWT2024MustBe256BitsLongForHS256Algorithm!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}      # 15 minutes
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days
  issuer: coursehub.com

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dk4uhrl7t}
  api-key: ${CLOUDINARY_API_KEY:281834123567723}
  api-secret: ${CLOUDINARY_API_SECRET:EUMUPKnX_vkZW4E1_TrfSZ82wnI}

# Application specific settings
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  otp:
    ttl-minutes: 5
    max-attempts: 3
    length: 6
  account-lockout:
    max-attempts: 5
    lock-duration-minutes: 15
  password-reset:
    ttl-minutes: 15
  review:
    min-progress-percent: 30.0
  report:
    auto-escalate-threshold: 5
  pagination:
    default-page-size: 12
    max-page-size: 100

# Logging
logging:
  level:
    com.coursehub: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Global defaults
    defaults:
      enabled: true
    # Production sẽ override nếu cần

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    disable-swagger-default-url: true
  info:
    title: CourseHub API
    version: 1.0.0
    description: CourseHub Online Learning Marketplace RESTful API
