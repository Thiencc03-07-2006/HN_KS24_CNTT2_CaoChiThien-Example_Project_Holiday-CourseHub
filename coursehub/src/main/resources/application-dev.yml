# ============================================================
# CourseHub - DEV Profile Configuration
# Override settings from application.yml for local development
# ============================================================

spring:
  # JPA — verbose SQL for dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      enabled: true
      file: ../docker-compose.yml
      lifecycle-management: start-only

  # Mail — DISABLE real email in dev, use console mock
  mail:
    host: smtp.gmail.com
    port: 587
    username: dev@coursehub.local
    password: mock-password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

# Logging — more verbose for dev
logging:
  level:
    com.coursehub: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.mail: DEBUG

# Dev-specific app settings
app:
  frontend-url: http://localhost:5173
  dev:
    mock-email: true    # When true, OTP and emails are logged to console instead of sent
    mock-otp: "123456"  # Fixed OTP for easy testing; leave empty to use random OTP
